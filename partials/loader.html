<style>
    .loader {
        position: fixed;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        z-index: 1500;
        background-color: #E7E7E9;
        display: grid;
        place-items: center;

    }

    .loader svg {
        fill: none;
    }

    .loader__logo {
        width: 164px;
        height: auto;
        z-index: 20;
    }

    .loader__logo svg {
        display: block;
        width: 100%;
        height: auto;
    }

    .loader__pattern {
        position: absolute;
        inset: 0;
    }

    .loader__pattern svg {
        position: absolute;
        left: 0;
        top: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
    }

    .loader__pattern svg:nth-child(2) {
        display: none;
    }

    body:has(.loader) {
        touch-action: none;
        -webkit-overflow-scrolling: none;
        overflow: hidden;
        overscroll-behavior: none;
    }

    @media only screen and (max-width: 576px) {
        .loader__pattern svg:nth-child(1) {
            display: none;
        }

        .loader__pattern svg:nth-child(2) {
            display: block;
        }
    }
</style>

<div class="loader" data-lenis-prevent="">
    <div class="loader__pattern">
        {{> loader-pattern }}
    </div>
    <div class="loader__logo">
        {{> loader-logo }}
    </div>
</div>
